[project]
name = "warp-distplots"
version = "0.1.0"
description = "Distribution analysis and plotting tools for warp object-size distributions (log₂ and lognormal)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "polars>=1.40.0",
    "seaborn>=0.13.2",
]
